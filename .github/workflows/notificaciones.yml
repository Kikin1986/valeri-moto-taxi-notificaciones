name: Notificaciones automáticas Valeri Moto Taxi

on:
  schedule:
    - cron: "*/5 * * * *" # revisión automática
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notificaciones-valeri-moto-taxi
  cancel-in-progress: false

jobs:
  notificar:
    name: Revisar solicitudes y notificar conductores
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install

      - name: Procesar solicitudes y notificaciones
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node notificar.js
